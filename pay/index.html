<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay link unavailable — Divido</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #dce8e4;
      --surface: #f3f8f6;
      --ink: #0f1f1a;
      --muted: #4f655c;
      --line: #b7c9c1;
      --primary: #047857;
      --mint: #00e5a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(900px 480px at 10% -10%, #cfe6dd, transparent 58%), var(--bg);
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
    }
    main { max-width: 520px; margin: 0 auto; padding: 28px 20px 64px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
    .logo svg { width: 36px; height: 36px; }
    .logo span { font-family: Fraunces, Georgia, serif; font-size: 1.5rem; font-weight: 640; }
    .logo i { font-style: italic; color: var(--primary); }
    .card {
      margin-top: 36px;
      padding: 28px 22px;
      border-radius: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .kicker { margin: 0 0 8px; color: var(--primary); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
    h1 { margin: 0 0 12px; font-family: Fraunces, Georgia, serif; font-size: 2rem; font-weight: 520; }
    p { color: var(--muted); line-height: 1.55; }
    .home {
      display: inline-flex;
      margin-top: 8px;
      padding: 14px 18px;
      border-radius: 18px;
      background: var(--mint);
      color: #000;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="12" fill="#00E5A3"></rect>
        <path d="M13 10h7.2c6.2 0 10.4 3.8 10.4 10s-4.2 10-10.4 10H13V10z" fill="none" stroke="#0F1F1A" stroke-width="3.2"></path>
        <path d="M20 8v24" stroke="#0F1F1A" stroke-width="2.4" stroke-linecap="round"></path>
        <path d="M20 8v24" stroke="#DCE8E4" stroke-width="1.1" stroke-linecap="round"></path>
      </svg>
      <span>Div<i>i</i>do</span>
    </a>
    <section class="card">
      <p class="kicker">Settle up</p>
      <h1>This pay link is not available yet</h1>
      <p>Bank-app pay from a shared link is paused. Open Divido and settle from the group, or share bank details from Settle up as usual. Divido never sends money.</p>
      <a class="home" href="/">Back to Divido</a>
    </section>
  </main>
</body>
</html>
